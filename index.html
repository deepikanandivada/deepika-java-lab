.btn:hover{border-color:var(--ac);transform:translateY(-3px)}.btn small{display:block;color:var(--mu);font-weight:400;margin-top:4px}
.list .btn{text-align:left;display:flex;gap:12px;margin-bottom:10px;padding:14px 16px}.list .n{color:var(--ac);font-weight:700;min-width:34px}
.crumb{color:var(--mu);font-size:.9rem}.crumb a{color:var(--ac)}
pre{background:var(--code);color:#e6e1ff;padding:16px;border-radius:12px;overflow-x:auto;font:.88rem/1.5 Consolas,monospace;margin:8px 0}
pre.out{border-left:4px solid var(--ac2);color:#7ef5df}.lab{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}
.cp{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border:1px solid #7c3aed22;text-align:left;font-size:.9rem}th{background:var(--ac);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:30px}.nav a{color:var(--ac);font-weight:600;text-decoration:none}
.note{background:var(--card);padding:24px;border-radius:14px;text-align:center;color:var(--mu)}

}`,"",`Task t = new Task();|System.out.println("Before start: " + t.isAlive());|t.start();|System.out.println("After start: " + t.isAlive());|t.join();|System.out.println("After join: " + t.isAlive());`),"Before start: false\nAfter start: true\nAfter join: false"),
Q("join() Method",S(`class Child extends Thread {
  public void run() {
    try {
      Thread.sleep(100); System.out.println("Child thread working...");
      Thread.sleep(100); System.out.println("Child thread finished");
    } catch (InterruptedException e) { }
  }
}`,"",`Child c = new Child();|c.start();|System.out.println("Main waiting for child...");|c.join();|System.out.println("Main resumes after child");`),"Main waiting for child...\nChild thread working...\nChild thread finished\nMain resumes after child"),
Q("isAlive() and join() — Execution Order",S(`class Job extends Thread {
  int ms;
  Job(String n, int ms) { super(n); this.ms = ms; }
  public void run() {
    try { Thread.sleep(ms); } catch (InterruptedException e) { }
    System.out.println(getName() + " done");
  }
}`,"",`Job t1 = new Job("T1", 200), t2 = new Job("T2", 100);|t1.start();|System.out.println("T1 alive: " + t1.isAlive());|t1.join();|t2.start();|System.out.println("T2 alive: " + t2.isAlive());|t2.join();|System.out.println("T1 alive: " + t1.isAlive() + ", T2 alive: " + t2.isAlive());`),"T1 alive: true\nT1 done\nT2 alive: true\nT2 done\nT1 alive: false, T2 alive: false")
]});
const TP=`class Show extends Thread {
  Show(String n) { super(n); }
  public void run() { System.out.println(getName() + " priority = " + getPriority()); }
}`;
WEEKS.push({n:12,name:"Synchronization & Lambdas",progs:[
Q("Thread Priorities",S(TP,"",`Show lo = new Show("Low"), mid = new Show("Medium"), hi = new Show("High");|lo.setPriority(Thread.MIN_PRIORITY);|mid.setPriority(Thread.NORM_PRIORITY);|hi.setPriority(Thread.MAX_PRIORITY);|lo.start(); lo.join();|mid.start(); mid.join();|hi.start(); hi.join();`),"Low priority = 1\nMedium priority = 5\nHigh priority = 10"),
Q("Three Threads with Different Priorities",S(TP,"",`Show a = new Show("Thread-A"), b = new Show("Thread-B"), c = new Show("Thread-C");|a.setPriority(2); b.setPriority(5); c.setPriority(9);|a.start(); b.start(); c.start();|a.join(); b.join(); c.join();`),"Thread-A priority = 2\nThread-B priority = 5\nThread-C priority = 9\n\n(execution order is decided by the scheduler and may vary between runs)"),
Q("Synchronized Method — Shared Counter",S(`class Counter {
  int c = 0;
  synchronized void inc() { c++; }
}`,"",`Counter ct = new Counter();|Runnable r = () -> { for (int i = 0; i < 1000; i++) ct.inc(); };|Thread t1 = new Thread(r), t2 = new Thread(r);|t1.start(); t2.start();|t1.join(); t2.join();|System.out.println("Final count: " + ct.c);`),"Final count: 2000"),
Q("Synchronized Block",S(`class Printer {
  void use(String n) throws InterruptedException {
    synchronized (this) {
      System.out.println(n + " entered");
      Thread.sleep(100);
      System.out.println(n + " leaving");
    }
  }
}`,"",`Printer p = new Printer();|Thread t1 = new Thread(() -> { try { p.use("T1"); } catch (Exception e) { } });|Thread t2 = new Thread(() -> { try { p.use("T2"); } catch (Exception e) { } });|t1.start(); Thread.sleep(30); t2.start();|t1.join(); t2.join();`),"T1 entered\nT1 leaving\nT2 entered\nT2 leaving"),
Q("Race Condition and Synchronization",S(`class Plain { int c = 0; void inc() { c++; } }
class Safe { int c = 0; synchronized void inc() { c++; } }`,"",`Plain p = new Plain(); Safe s = new Safe();|Runnable r1 = () -> { for (int i = 0; i < 100000; i++) p.inc(); };|Runnable r2 = () -> { for (int i = 0; i < 100000; i++) s.inc(); };|Thread a = new Thread(r1), b = new Thread(r1), c = new Thread(r2), d = new Thread(r2);|a.start(); b.start(); a.join(); b.join();|c.start(); d.start(); c.join(); d.join();|System.out.println("Without synchronization: " + p.c);|System.out.println("With synchronization: " + s.c);`),"Without synchronization: 143267\nWith synchronization: 200000\n\n(the unsynchronized value is usually below 200000 and changes on every run)"),
Q("Synchronized Ticket Booking System",S(`class Booking {
  int tickets = 5;
  synchronized void book(String name, int n) {
    if (n <= tickets) { tickets -= n; System.out.println(name + " booked " + n + " ticket(s). Remaining: " + tickets); }
    else System.out.println(name + ": tickets not available. Remaining: " + tickets);
  }
}`,"",`Booking b = new Booking();|Thread t1 = new Thread(() -> b.book("Deepika", 2));|Thread t2 = new Thread(() -> b.book("Ananya", 2));|Thread t3 = new Thread(() -> b.book("Sneha", 2));|t1.start(); Thread.sleep(50);|t2.start(); Thread.sleep(50);|t3.start();|t1.join(); t2.join(); t3.join();`),"Deepika booked 2 ticket(s). Remaining: 3\nAnanya booked 2 ticket(s). Remaining: 1\nSneha: tickets not available. Remaining: 1"),
Q("Lambda Expressions — Arithmetic Operations",S(`interface Operation { int apply(int a, int b); }`,"",`Operation add = (a, b) -> a + b;|Operation sub = (a, b) -> a - b;|Operation mul = (a, b) -> a * b;|Operation div = (a, b) -> a / b;|System.out.println("Addition: " + add.apply(20, 5));|System.out.println("Subtraction: " + sub.apply(20, 5));|System.out.println("Multiplication: " + mul.apply(20, 5));|System.out.println("Division: " + div.apply(20, 5));`),"Addition: 25\nSubtraction: 15\nMultiplication: 100\nDivision: 4"),
Q("Lambda with Single and Multiple Parameters",S(`interface Square { int calc(int n); }
interface Sum { int calc(int a, int b); }`,"",`Square s = n -> n * n;|Sum m = (a, b) -> a + b;|System.out.println("Square of 6: " + s.calc(6));|System.out.println("Sum of 10 and 15: " + m.calc(10, 15));`),"Square of 6: 36\nSum of 10 and 15: 25"),
Q("Block Lambda Expression",S(`interface Calc { int run(int n); }`,"",`Calc fact = n -> {|  System.out.println("Calculating factorial of " + n);|  int r = 1;|  for (int i = 1; i <= n; i++) r *= i;|  return r;|};|System.out.println("Factorial: " + fact.run(5));`),"Calculating factorial of 5\nFactorial: 120"),
Q("Block Lambda — Largest of Two Numbers",S(`interface Max { int find(int a, int b); }`,"",`Max m = (a, b) -> {|  if (a > b) return a;|  else return b;|};|System.out.println("Largest: " + m.find(45, 78));`),"Largest: 78"),
Q("Generic Functional Interface",S(`interface Operation<T> { T apply(T x); }`,"",`Operation<Integer> sq = x -> x * x;|Operation<String> up = s -> s.toUpperCase();|Operation<Double> half = d -> d / 2;|System.out.println(sq.apply(9));|System.out.println(up.apply("java"));|System.out.println(half.apply(7.0));`),"81\nJAVA\n3.5"),
Q("Generic Functional Interface — Two Values",S(`interface Operation<T> { T apply(T a, T b); }`,"",`Operation<Integer> add = (a, b) -> a + b;|Operation<String> join = (a, b) -> a + b;|Operation<Double> mul = (a, b) -> a * b;|System.out.println(add.apply(10, 20));|System.out.println(join.apply("Hello, ", "Java"));|System.out.println(mul.apply(2.5, 4.0));`),"30\nHello, Java\n10.0"),
Q("Lambda with ArrayList — Display and Filter",S("import java.util.*;\nimport java.util.stream.*;","",`List<Integer> nums = new ArrayList<>(Arrays.asList(12, 5, 18, 7, 30, 21));|System.out.println("Elements:");|nums.forEach(n -> System.out.println(n));|List<Integer> even = nums.stream().filter(n -> n % 2 == 0).collect(Collectors.toList());|System.out.println("Even numbers: " + even);`),"Elements:\n12\n5\n18\n7\n30\n21\nEven numbers: [12, 18, 30]"),
Q("Sorting with Lambda Expressions",S("import java.util.*;","",`List<Integer> nums = new ArrayList<>(Arrays.asList(45, 12, 78, 5, 30));|nums.sort((a, b) -> a - b);|System.out.println("Ascending: " + nums);|nums.sort((a, b) -> b - a);|System.out.println("Descending: " + nums);|List<String> names = new ArrayList<>(Arrays.asList("Banana", "Apple", "Cherry"));|names.sort((a, b) -> a.compareTo(b));|System.out.println("Strings: " + names);`),"Ascending: [5, 12, 30, 45, 78]\nDescending: [78, 45, 30, 12, 5]\nStrings: [Apple, Banana, Cherry]"),
Q("Thread Using Lambda Expression",S("","",`Thread t = new Thread(() -> System.out.println("Thread running using lambda"));|t.start();|t.join();|System.out.println("Main finished");`),"Thread running using lambda\nMain finished")
]});

function week(n){const x=WEEKS[n-1];if(!x)return home();let h=`<p class="crumb"><a href="#/">Home</a> / Week ${n}</p><h2>Week ${n}: ${x.name}</h2>`;

function prog(n,i){const x=WEEKS[n-1],p=x&&x.progs&&x.progs[i-1];if(!p)return week(n);
